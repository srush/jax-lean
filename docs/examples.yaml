  - title: Transpilation to Lean
    id: transpilation
    blocks:
    - type: text
      text: |
        [TEXT: Aeneas; translation; trusted importer; ideal-real semantics and floating-point boundary]

        Reading in Jaxpr's to Lean gives a source of ground truth for the original 
        code. With this we can then generate explicit Lean code that implements the 
        core operations.

      marker: Aeneas; translation; trusted importer; ideal-real semantics and floating-point boundary
    - type: lean
      module: examples.tensor_puzzles.generated.PuzzlesEye
      name: JaxLean.Puzzles.Eye.Array.fn__where
      section: Lean helper
    - type: text
      text: |
        Since this implementation is generated, the code might deviate from the 
        IR, but since they are both in Lean we can prove directly that it implements 
        the IR precisely. The following
        theorem shows that the code matches its IR.

      marker: after JaxLean.Puzzles.Eye.Array.fn__where
    - type: lean
      module: JaxLean.Core.Jaxpr
      name: JaxLean.Jaxpr.Program.eval
      section: Semantics · execute bindings and calls
    - type: lean
      module: JaxLean.Verification.JaxprRules
      name: JaxLean.Jaxpr.eval_iota
      section: Semantics · iota reads a coordinate
    - type: lean
      module: JaxLean.Verification.JaxprRules
      name: JaxLean.Jaxpr.eval_bind
      section: Certificate rule · evaluate one binding
    - type: lean
      module: examples.tensor_puzzles.generated.PuzzlesEye
      name: JaxLean.Puzzles.Eye.Array.eye_translation_correct
      section: Translation certificate
    - type: text
      text: |
        A bigger challenge is ensuring that the code acts the same 
        way of the original JAX. The core operations used in the JAX 
        core are well documented, so we can get most of them correct.
        The bigger issue is handling all the problems that arise from 
        floating point numbers and possible interactions with 
        accelerators. We are mostly going to ignore this for now 
        and assume the semantics of real numbersis close enough for our problems. 

        
        
      marker: after JaxLean.Puzzles.Eye.Array.eye_translation_correct

    - type: lean
      module: examples.tensor_puzzles.generated.PuzzlesEye
      name: JaxLean.Puzzles.Eye.Array.eye
      section: Transpiled Lean
    - type: text
      text: |
        
      marker: after JaxLean.Puzzles.Eye.Array.eye
    - type: eval_code
    - type: text
      text: |
        
      marker: before Lean evaluation output
    - type: eval_output
    - type: text
      text: |
        
      marker: after Lean evaluation output

