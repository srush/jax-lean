# Each section renders its blocks in list order. Move blocks to reorder the article.
# Text blocks accept Markdown; empty text shows its marker.

pages:
- slug: blog
  title: Provably Correct Tensor Puzzles
  layout: blog
  stylesheets: [docs/blog.css]
  contents_title: Contents
  cards:
  - title: Introduction
    id: introduction
    position: before_contents
    show_heading: false
    toc: false
    blocks:
    - type: text
      text: |
        A couple of years ago, [@jxmnop](https://x.com/jxmnop) talked me
        into writing a collection of
        [tensor puzzles](https://github.com/srush/tensor-puzzles).
        Over time, they have become popular job interview prep
        for wannabe MsTS. The puzzles give the user a specification
        written in easy-to-read Python and ask them to
        generate a vectorized implementation.

    - type: python
      file: examples/tensor_puzzles/code.py
      name: loop_cumsum
      section: Pseudocode

    - type: python
      file: examples/tensor_puzzles/code.py
      name: puzzle_cumsum
      section: JAX solution
    - type: text
      text: |

        Recently, I have been thinking about formal verification and
        envisioning what it might look like for everyday coders. This seemed like
        a good place to start.
        In this blog, we walk through how to prove puzzle solutions correct
        and build a library for proving properties of arbitrary JAX code: [srush/jax-lean](https://github.com/srush/jax-lean).
        It was inspired by conversations with [pmocz](https://github.com/pmocz/), [nielstron](https://github.com/nielstron), and these projects:

        * [Noether on GitHub](https://github.com/pmocz/noether)
        * [Aeneas](https://lean-lang.org/use-cases/aeneas/)
        * [Autodidax](https://docs.jax.dev/en/latest/autodidax2_part1.html)

        The code and proofs are
        written by AI; the writing is human. This is a follow-up to [Lean-Verified Transformers](https://srush.github.io/lean-transformer/).

  - title: 'Background: JAX IR'
    id: jax-ir
    blocks:
    - type: text
      text: |
        [JAX](http://github.com/google/jax) is a numerical transformation system
        that utilizes a nearly one-to-one NumPy interface. While the primary use of JAX is machine
        learning, the core framework has remained impressively ML-agnostic. Instead, it focuses on
        a core set of transformations that can be reduced to simple numerical operations.

        JAX is also a magic trick. The user thinks they are writing Python, while actually
        it is pulling out code using a minimal core of numerical operations. Proving properties
        of Python is nearly impossible, but proofs using this intermediate representation
        are more tractable.

        If you are interested in the details of how JAX works, they have an amazing tutorial
        known as [Autodidax](https://docs.jax.dev/en/latest/autodidax2_part1.html).
        Here, we will just briefly outline the process.

        Let's begin with a simple function that adds two vectors and multiplies the result by 2.

    - type: python
      file: examples/blog/code.py
      name: add_then_scale
    - type: text
      text: |
        When we run this Python code, JAX is tracing the path and producing its
        own representation of what operations were called.

    - type: code
      language: python
      text: |
        a = jnp.array([1., 2., 3.], dtype=jnp.float32)
        b = jnp.array([4., 5., 6.], dtype=jnp.float32)
        print(jax.make_jaxpr(add_then_scale)(a, b))
    - type: diagram
      file: docs/jax-pipeline.svg
      alt: JAX to Jaxpr to StableHLO / XLA, branching to TPU and GPU

    - type: text
      text: |
        The intermediate representation is known as Jaxpr. It lives
        between your Python code and the final lower-level representations that execute
        the mathematical operations on hardware.

        One day, we hope to have specs all the way down to the GPU. However, we are going
        to focus on this Jaxpr level and assume everything below roughly follows what it says.
        This is a horrible assumption for ML code, as numerical precision is of huge importance.
        Hopefully, we can cover this in future blogs.

        Let's look at the Jaxpr output from our function. It should look familiar. It takes two arguments: float32 vectors of size 3.
        It adds them into a temporary variable, multiplies it by 2, and returns the result.

    - type: output
      runtime: python
      module: examples.blog.code
      args: [add]
    - type: text
      text: |
        Of course, this code will get more complex with more realistic examples.
        There is a set of operations that specify the core numerical transformations
        needed. The core idea, though, is that it will remain a sequence of these operations,
        without loops or other control flow.

    - type: python
      file: examples/blog/code.py
      name: eye
    - type: code
      language: python
      text: |
        print(jax.make_jaxpr(eye, static_argnums=(0,))(3))
        print(eye(3))

    - type: output
      runtime: python
      module: examples.blog.code

  - title: Transpilation to Lean
    id: transpilation
    blocks:
    - type: diagram
      file: docs/transpilation-pipeline.svg
      alt: Imported Lean Jaxpr, its interpreter, and the transpiled Lean function connected by a translation certificate
    - type: text
      text: |

        Our strategy to prove the correctness of this code
        is to transpile it over to Lean and then write proofs
        for the Lean version of the code. We do this with three
        Lean modules.

        1. A mapping of the low-level Jaxpr
        2. An implementation of a Jaxpr interpreter
        3. A mapping of the high-level Jaxpr code.

        If we trust our Jaxpr interpreter, we can then
        prove things about our JAX code in Lean and then
        prove that those properties also apply to the original Python code.

        Let's walk through each of the steps.

    - type: text
      text: |
        First, we are going to
        map over the Jaxpr from the first section to Lean. Lean has a powerful
        macro system, so we can make the mapping
        look nearly identical to the original representation. We follow the specified
        syntax of the original, propagating forward some additional guarantees about
        bounds and dimensions.

    - type: lean
      module: examples.blog.generated.AddScale
      name: JaxLean.Blog.add_then_scale_ir
      section: Lean IR
    - type: text
      text: |
        Next, we need an implementation of the Jaxpr IR in Lean.
        As far as I know, there is not a formal specification of this
        language, but each part is well documented. In a more realistic
        setting, we would want to match the lower-level instructions exactly.

        In addition to trusting that this interpreter matches Jaxpr, we are also
        going to relax the floating-point challenges at this stage. Our
        interpreter will just pretend things work like the reals.

    - type: lean
      module: JaxLean.Core.Jaxpr
      name: JaxLean.Jaxpr.Program.eval
      section: Semantics · execute bindings and calls
    - type: code
      language: lean-source
      file: JaxLean/Core/Jaxpr.lean
      excerpt:
        start: '  | .add x y left right _ =>'
        end: '  | .sub x y left right _ =>'
    - type: text
      text: |

        Given the source of truth of the Jaxpr representation, we can now
        transpile the Jaxpr into something that is a bit more readable.
        This will look kind of like a line-aligned Lean implementation of the
        original code. Since this code will not be executed, we can apply transformations
        to make it a bit easier to use for our proofs (for instance, see the variance example
        below).

    - type: lean
      module: examples.blog.generated.AddScale
      name: JaxLean.Blog.add_then_scale
    - type: text
      text: |
        Since this implementation is generated, we shouldn't trust that it is correct.
        We therefore need to actually prove this.
        The following theorem shows that the code matches its IR.

    - type: lean
      module: examples.blog.generated.AddScale
      name: JaxLean.Blog.add_then_scale_translation_correct

    - type: text
      text: |
        If we can complete each of these three steps, we know that we have passed the implementation across
        the language barrier. Our implementation does this for most of the core Jaxpr IR with the assumption
        that we are working with the reals. From here on out, we can assume we are working with implementations
        in the proof language Lean.

  - title: 'Puzzle Proofs'
    id: certification
    blocks:
    - type: text
      text: |
        We can now go back to the puzzles.
        We consider an example of the original `outer` puzzle, which
        asks the user to produce the outer product of two vectors.
        Here's the original code and the transpiled Lean.

    - type: python
      file: examples/tensor_puzzles/code.py
      name: puzzle_outer
    - type: lean
      module: examples.tensor_puzzles.generated.PuzzleOuterFlatten
      name: JaxLean.PuzzleJax.puzzle_outer
    - type: text
      text: 'In a similar way, we convert the loop version to Lean. This one is a bit long since JAX unrolls the loop to a sequence of instructions, so I am omitting the Lean code.'
    - type: python
      file: examples/tensor_puzzles/code.py
      name: loop_outer
    - type: text
      text: |
        The goal is to certify that this produces the same output as
        the vectorized version. Once we are in Lean, proving this kind of thing
        is actually relatively straightforward. The code below automatically converts
        the broadcasting operations into expanded cases and enumerates all 2 × 3 cases
        to check that they produce the same result as the loop.

    - type: lean
      module: examples.tensor_puzzles.proofs.TensorLoopProofs
      name: JaxLean.PuzzleJax.outer_matches_loop
    - type: text
      text: "We combine this with the proof that the Jaxpr matches the above functions. We now have a full proof that the puzzle was correct!"
    - type: lean
      module: examples.tensor_puzzles.proofs.TensorLoopProofs
      name: JaxLean.PuzzleJax.certified_outer_loop

  - title: 'Verified Properties'
    id: verified-properties
    blocks:
    - type: text
      text: |
        Of course, just proving the correctness of puzzles is not that useful.
        Things become more interesting when we want to complete arbitrary ad hoc
        proofs about our code. To illustrate roughly what this might look like,
        let's walk through a few properties and look at:

        * The JAX code
        * The spec to prove
        * An example of the proof (that an LLM might write for us)

  - title: 'Transformer Properties'
    id: transformer
    subheading: true
    blocks:
    - type: text
      text: |
        Recently, I wrote a blog post on
        [Lean-Verified Transformers](https://srush.github.io/lean-transformer/)
        that implemented several equivariance properties of transformers directly in Lean.
        We probably don't want to write the code in Lean, so we can write it in
        JAX and transpile it over.

        We first define equivariance as:

    - type: math
      text: B(PX; W) = P B(X; W)
    - type: text
      text: 'The goal is to prove that a transformer without positional encoding is position-equivariant. We start with the transformer block in JAX.'

    - type: python
      file: examples/transformer/code.py
      name: transformer_block
    - type: text
      text: 'A proof of part of this property would look like this.'
    - type: lean
      module: examples.transformer.proofs.TransformerProofs
      name: JaxLean.TransformerJax.attention_permute
    - type: text
      text: 'And then we can propagate this through the whole stack.'
    - type: code
      language: lean-source
      file: examples/transformer/proofs/TransformerProofs.lean
      excerpt:
        start: 'theorem transformer_block_permute '
        end: ' := by'

  - title: 'Norm Clipping'
    id: norms
    subheading: true
    blocks:
    - type: text
      text: |
        Let's consider another simple, but common, example in ML.
        We want to guarantee that, after applying norm clipping in our
        code, we arrive at a gradient norm that is at most our fixed bound.

    - type: math
      text: r > 0 ⟹ ‖norm_clip(x, r)‖₂ ≤ min(r, ‖x‖₂)
    - type: python
      file: examples/norms/code.py
      name: norm_clip
    - type: text
      text: 'The goal here is to obtain the following certificate.'
    - type: code
      language: lean-source
      file: examples/norms/proofs/NormProofs.lean
      excerpt:
        start: 'theorem norm_clip_bound '
        end: ' := by'
    - type: text
      text: 'For a simple example, this is a mechanical calculation. But if you imagine an optimized implementation, we would need to push this through the whole neural network.'
    - type: code
      language: lean-source
      file: JaxLean/Stdlib/NormRules.lean
      excerpt:
        start: 'theorem l2_clipL2_le '
        end: '

          end JaxLean.Batch'

  - title: 'Physics'
    id: physics
    subheading: true
    blocks:
    - type: text
      text: |
        As a final example, we can consider the use of JAX for non-ML projects.
        The inspiration for this blog is the
        [Noether](https://github.com/pmocz/noether) project, which aimed to
        guarantee similar properties of mathematical code. The motivating
        example is conservation of properties through code.

    - type: math
      text: F(u)ᵢ = uᵢ − λ (½uᵢ² − ½uᵢ₋₁²);  ∑ᵢ F(u)ᵢ = ∑ᵢ uᵢ
    - type: python
      file: examples/noether/code.py
      name: burgers
    - type: text
      text: |
        The conservation law can be written with the following
        guarantee, which propagates through the system.
    - type: code
      language: lean-source
      file: examples/noether/proofs/NoetherProofs.lean
      excerpt:
        start: 'theorem burgers_conserves_sum '
        end: ' := by'
    - type: lean
      module: examples.noether.proofs.NoetherProofs
      name: JaxLean.NoetherProofs.burgers_spec

  - title: 'Extension: Variance'
    id: variance
    blocks:
    - type: text
      text: |
        One thing that I have personally wanted for years is better
        guarantees for code that uses sampling, such as RL. Techniques
        like probabilistic programming provide these, but are not typically
        used in scaled systems. One solution might be to implement the JAX
        code as is and prove that it matches a clean spec for its probabilistic
        properties.

        As a simple example, let us imagine doing Monte Carlo sampling
        that takes 16 samples of a die roll. We would like to establish
        the variance of our estimator.

    - type: math
      text: Xᵢ ∼ Uniform{1, …, 6}, independent;  Var[(X₁ + ⋯ + X₁₆) / 16]
    - type: text
      text: 'The code itself will just be an imperative sampling implementation in JAX.'
    - type: python
      file: examples/randint_monte_carlo/code.py
      name: die_draw
    - type: python
      file: examples/randint_monte_carlo/code.py
      name: die_estimate
    - type: python
      file: examples/randint_monte_carlo/code.py
      name: mc_die_16
    - type: text
      text: 'The Lean theorem will be like the math above.'
    - type: code
      language: lean-source
      file: examples/randint_monte_carlo/proofs/RandintMonteCarloProofs.lean
      excerpt:
        start: 'theorem mc_die_variance :'
        end: ' := by'
    - type: text
      text: 'In this case, the proof just propagates the variance through the operations.'
    - type: lean
      module: examples.randint_monte_carlo.proofs.RandintMonteCarloProofs
      name: JaxLean.MCJax.mc_die_variance_reduction

  - title: 'Derivatives and Mathlib'
    id: autodiff
    blocks:
    - type: text
      text: |
        As a final example, let's consider how these proofs might actually interact
        with all the work going on in formalizing mathematics. This is a toy example
        where we verify that the real-valued version of our JAX code produces the mathematically
        correct gradient.

        For deeper examples of this, see the text on
        [Verified Deep Learning with Lean 4](https://lean.brettkoonce.com/blueprint/).

    - type: math
      text: f(x) = x² + 3x;  f′(x) = 2x + 3
    - type: text
      text:  |
        We first define the function in JAX and then perform autodiff 
        in the standard JAX manner to create a function for its derivative. 


    - type: python
      file: examples/autodiff/code.py
      name: quadratic
    - type: python
      file: examples/autodiff/code.py
      name: gradient
    - type: text
      text:  |
        JAX will then lower the new function to Jaxpr that we can apply our 
        method to. It goes through the conversion to Lean in the standard way. 

    - type: output
      runtime: python
      module: examples.autodiff.code

    - type: text
      text:  |
        There are many things we might prove here, but to keep things simple 
        let's just get a certificate that the autodiff Jaxpr is equivalent to the 
        mathematical derivative of the original function. We are using `mathlib` 
        here with the `deriv` operator to produce that function directly. 
    - type: code
      language: lean-source
      file: examples/autodiff/proofs/Jvp.lean
      excerpt:
        start: 'theorem gradient_correct '
        end: ' := by'
    - type: lean
      module: examples.autodiff.proofs.Jvp
      name: JaxLean.Autodiff.quadratic_hasDerivAt
  - title: 'Conclusion'
    id: autodiff
    blocks:
    - type: text
      text: |
        This library provides a working implementation of the conversion between 
        JAX and Lean with the ability to write non-trivial proofs. 
        This is meant as a glance at what fully verifiable ML might allow
        for checking core properties like faithfulness, numerical stability, and 
        statistical correctness. However, there is still lots to do here, including
        dealing with numerical precision, distributed components, making certificates more readable, and 
        handling the devex of changing code and proofs. As in many areas, the future here
        will be quite unpredictable.  




