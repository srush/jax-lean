# Each section renders its blocks in list order. Move blocks to reorder the article.
# Text blocks accept Markdown; empty text shows its marker.

pages:
- slug: blog
  title: Lean-Verified Jax
  layout: blog
  cards:
  - title: Introduction
    id: introduction
    blocks:
    - type: text
      text: |
        I have been interested recently in the impact on ML programming
        as the cost of proofs goes to zero. Part of this interest comes
        from wanting more stable training runs, part of it comes from
        the general sense that we are all drowning in code reviews.
        For this to be useful we likely would need proofs for
        existing programming languages.

        One example of this is [Aeneas](https://github.com/AeneasVerif/aeneas)
        which is language for proving the correctness of Rust code. It works
        by transpiling from Rust into Lean, where you can prove important properties.
        Of course this approach would be ridiculous for a language like Python
        which feels almost beyond specification.


        Luckily, this approach works better for ML library like JAX.
        While JAX uses Python and looks Pythonic,
        it actually is much more constrained.
        In this blog, we are going to prove the correctness of some non-trivial
        JAX programs.
        The library developed for this blog is at
        [srush/jax-lean](https://github.com/srush/jax-lean). The code and proofs are
        written by AI, the writing is human.
        This is a followup on [Lean-Verified Transformers](https://srush.github.io/lean-transformer/)·

        - srush
      marker: Introduction
  - title: 'Goal: Certified Solutions'
    id: certified-solutions
    blocks:
    - type: text
      text: |
        A couple years ago, I wrote a set of 
        [tensor-puzzles](https://github.com/srush/tensor-puzzles) as a way to help 
        students understand broadcasting better. The puzzles give the user a specification 
        written as an easy to read Python loop. Here the function is a cumulative sum. 

      marker: Goal; certified solutions
    - type: python
      file: examples/tensor_puzzles/code.py
      name: loop_cumsum
      section: Pseudocode
    - type: text
      text: | 
        Given this code, the student is asked to produce a vectorized implementation. 
        Many of these are quite strange looking as they use all the fun or 
        horrible Numpy tricks.
        
      marker: after cumsum pseudocode
    - type: python
      file: examples/tensor_puzzles/code.py
      name: puzzle_cumsum
      section: JAX solution
    - type: text
      text: |
        When I wrote the puzzles originally, the answers were checked using quickcheck-style randomized 
        tests. This is a completely sufficient solution to this problem, and there was never in issue.
        However, recently I have been wondering whether you could formally guarantee that a solution is
        correct.
        
      marker: after cumsum solution
  - title: 'Background: Jax IR'
    id: jax-ir
    blocks:
    - type: text
      text: |
        [JAX](http://github.com/google/jax) is a numerical transformation system
        that utilizes a near 1-to-1 Numpy interface. While the primary use of JAX is machine
        learning, the core framework has remained impressively ML agnostic. Instead it focuses on
        a core set of transformation that can be reduced to a simple numerical operations.

        If you are interested in the details of how Jax works they have an amazing tutorial
        known as [Autodidax](https://docs.jax.dev/en/latest/autodidax2_part1.html).
        We will focus particularly on the process in which they trace Python code to IR.

        Let's begin with a simple function that adds two vectors and multiplies the result by 2.

      marker: Jax IR; addition of two vectors

    - type: python
      file: examples/blog/code.py
      name: add_then_scale
    - type: text
      text: | 
        We can run this function in the standard manner. When we run it 
        JAX is behind the scenes tracing the code and producing its 
        own representation of what going on. 
        
      marker: after add_then_scale
    - type: trace_code
      example: add
    - type: diagram

    - type: text
      text: |
        Its intermediate representation is known as Jaxpr. It lives 
        between your Python code and the final lower-level representations that execute
        the mathematical operations on hardware. We can even print it out for our function. 

        In this case it looks quite similar. It takes two args, float32 size 3 vectors. 
        Creates a temporary variable that adds them, multiplies it by 2, and returns the result.
        
      marker: before Jaxpr output
    - type: trace_output
      example: add
    - type: text
      text: |
        We map these Jaxpr's directly into a Lean data structure. 
        It looks mostly similar to the representation above. 
        Typed SSA names keep the inputs and intermediate values explicit.
         
        
      marker: after Jaxpr output

    - type: lean
      module: examples.blog.generated.AddScale
      name: JaxLean.Blog.add_then_scale_ir
      section: Lean IR
    - type: text
      text: |
        
      marker: after JaxLean.Blog.add_then_scale_ir
