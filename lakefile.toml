name = "jaxlean"
version = "0.1.0"
defaultTargets = ["JaxLean"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.33.0"

[[lean_lib]]
name = "JaxLean"

[[lean_lib]]
name = "JaxLeanExamples"
globs = ["JaxLeanExamples", "examples.+"]
