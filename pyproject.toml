[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxlean"
version = "0.1.0"
description = "A small Jaxpr to pure Lean translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jax[cpu]==0.8.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["jaxlean", "jaxlean.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/verso/tests"]
pythonpath = ["python", "tools/verso/src"]
addopts = "-m 'not lean' --strict-markers"
markers = ["lean: integration tests that launch Lean on temporary generated programs (opt in with -m lean)"]
