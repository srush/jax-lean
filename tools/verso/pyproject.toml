[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxlean-verso"
version = "0.1.0"
description = "Verso proof notebooks pairing Python source and checked Lean"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "markdown-it-py>=3,<5"]

[project.scripts]
jaxlean-verso = "jaxlean_verso.notebook:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jaxlean_verso", "jaxlean_verso.*"]
